<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrade Logistics | Authentication</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Relative Path for Web Application Context -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center font-sans antialiased relative overflow-hidden select-none">

<!-- Subtle Background Pattern -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-200/50 via-slate-50 to-slate-50 pointer-events-none"></div>

<!-- Main Container -->
<main class="w-full max-w-md p-6 relative z-10">
    <div class="card-entrance bg-white border border-slate-200 rounded-2xl p-8 shadow-xl relative">

        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-slate-900 text-white rounded-xl mb-4 shadow-md logo-float">
                <i class="fa-solid fa-boxes-packing text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">GlobalTrade Logistics</h1>
            <p class="text-xs uppercase tracking-widest text-slate-500 mt-1 font-mono">Enterprise Supply Chain Platform</p>
        </div>

        <!-- Dynamic Alert Container -->
        <div id="alertContainer" class="hidden mb-6 p-4 rounded-xl text-xs font-mono border flex items-center gap-3 transition-all duration-300">
            <i id="alertIcon" class="fa-solid text-sm"></i>
            <span id="alertMessage" class="flex-1"></span>
        </div>

        <!-- Authentication Form -->
        <form id="loginForm" class="space-y-5" autocomplete="off" method="POST" action="javascript:void(0);">

            <!-- Username Field -->
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2 font-mono">
                    Username / Email
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input
                            type="text"
                            id="username"
                            name="gt_user_identity"
                            autocomplete="off"
                            required
                            placeholder="username or email"
                            class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition-all placeholder-slate-400 font-sans"
                    >
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2 font-mono">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input
                            type="password"
                            id="password"
                            name="gt_user_secret"
                            autocomplete="new-password"
                            required
                            placeholder="••••••••••••"
                            class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl pl-10 pr-10 py-3 focus:outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition-all placeholder-slate-400 font-sans"
                    >
                    <button
                            type="button"
                            id="togglePasswordBtn"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-700 transition-colors focus:outline-none"
                    >
                        <i class="fa-regular fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button
                    type="submit"
                    id="submitBtn"
                    class="w-full mt-4 bg-slate-900 text-white hover:bg-slate-800 font-semibold py-3 px-4 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 group active:scale-[0.98] shadow-md"
            >
                <span id="btnText">Sign In</span>
                <i id="btnIcon" class="fa-solid fa-arrow-right text-sm transition-transform group-hover:translate-x-1"></i>
                <div id="btnSpinner" class="hidden spinner border-2 border-white border-t-transparent rounded-full w-4 h-4"></div>
            </button>

        </form>

        <!-- Footer -->
        <footer class="mt-8 text-center text-[11px] font-mono text-slate-400 border-t border-slate-100 pt-4">
            <span>GlobalTrade Login</span>
        </footer>

    </div>
</main>

<!-- Relative JS Path -->
<script src="assets/js/signin.js"></script>
</body>
</html>
